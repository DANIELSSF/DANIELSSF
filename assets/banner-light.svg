<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Daniel Silva · AI Engineer · Backend</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#0369a1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e4e4e7" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.7"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#d4d4d8"/>

  <!-- Copy -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="18" font-weight="600" letter-spacing="5" fill="#71717a">DANIEL SILVA</text>
    <text x="72" y="170" font-size="58" font-weight="800" fill="#09090b">AI Engineer <tspan fill="url(#accent)">· Backend</tspan></text>
    <text x="72" y="216" font-size="21" fill="#3f3f46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Node.js · TypeScript · NestJS · Go · GCP<tspan fill="#0369a1"> ▍<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
    <text x="72" y="262" font-size="16" fill="#71717a">Shipping LLM features to production · Colombia · remote · UTC-5</text>
  </g>

  <!-- Function-calling diagram -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- connectors: LLM -> tools (animated flow) -->
    <g fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 9" opacity="0.9">
      <path d="M918 160 C 960 160, 980 92, 1022 92">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M918 160 L 1022 160">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" begin="0.25s" repeatCount="indefinite"/>
      </path>
      <path d="M918 160 C 960 160, 980 228, 1022 228">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- user input -->
    <circle cx="790" cy="160" r="5" fill="#0369a1"/>
    <line x1="800" y1="160" x2="826" y2="160" stroke="#0369a1" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- LLM node -->
    <circle cx="872" cy="160" r="46" fill="#ffffff" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="872" cy="160" r="56" fill="none" stroke="#0369a1" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="52;60;52" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="872" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#09090b">LLM</text>
    <text x="872" y="238" text-anchor="middle" font-size="11" letter-spacing="1" fill="#71717a">function calling</text>
    <!-- tool pills -->
    <g fill="#f4f4f5" stroke="#d4d4d8">
      <rect x="1022" y="74" width="128" height="36" rx="18"/>
      <rect x="1022" y="142" width="128" height="36" rx="18"/>
      <rect x="1022" y="210" width="128" height="36" rx="18"/>
    </g>
    <g font-size="13" fill="#27272a" text-anchor="middle">
      <text x="1086" y="97">WhatsApp API</text>
      <text x="1086" y="165">Calendar API</text>
      <text x="1086" y="233">MySQL</text>
    </g>
  </g>
</svg>
